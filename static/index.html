<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>反兴奋剂检测与结果管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; background: #f9fafb; }
    main { max-width: 980px; margin: auto; }
    h1 { margin-bottom: .25rem; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
    label { font-size: .85rem; color: #374151; margin-right: .5rem; }
    select, input, button { padding: .4rem .6rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
    button { cursor: pointer; background: #2563eb; color: #fff; border-color: #2563eb; }
    button.secondary { background: #fff; color: #374151; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; font-size: .88rem; }
    th, td { text-align: left; padding: .45rem .55rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { color: #6b7280; font-weight: 600; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .78rem; font-weight: 600; }
    .ok { background: #dcfce7; color: #166534; }
    .bad { background: #fee2e2; color: #991b1b; }
    .warn { background: #fef9c3; color: #854d0e; }
    .muted { color: #6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    pre { background: #f3f4f6; padding: .75rem; border-radius: 8px; overflow-x: auto; font-size: .8rem; }
  </style>
</head>
<body>
<main>
  <h1>反兴奋剂检测与结果管理</h1>
  <p class="muted">处罚期版本 · 临时禁赛抵扣 · 复出检测 · 当前参赛资格</p>

  <div class="card row">
    <label>运动员</label>
    <select id="athlete"></select>
    <label>资格判定日期</label>
    <input type="date" id="asOf">
    <button onclick="loadAll()">查询资格</button>
    <button class="secondary" onclick="checkHealth()">健康检查</button>
  </div>

  <div class="card">
    <h2 style="margin:.2rem 0">当前资格</h2>
    <div id="eligibility"></div>
  </div>

  <div class="card">
    <h2 style="margin:.2rem 0">处罚期版本与抵扣</h2>
    <div id="sanctions"></div>
  </div>

  <div class="card">
    <h2 style="margin:.2rem 0">复出检测（需三次，检测日期须晚于最近处罚期结束日）</h2>
    <div id="tests"></div>
  </div>

  <div class="card">
    <h2 style="margin:.2rem 0">比赛成绩（作废成绩保留并标记）</h2>
    <div id="results"></div>
  </div>

  <pre id="result">等待操作</pre>
</main>
<script>
function headers() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': 'web-admin',
    'X-Role': 'admin'
  };
}
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function badge(status) {
  const map = {
    active: ['生效中', 'bad'],
    superseded: ['旧版保留', 'muted'],
    vacated: ['改判撤销', 'warn'],
    pending_backfill: ['待补', 'warn'],
    annulled: ['已作废', 'bad'],
    recorded: ['有效', 'ok'],
    eligible: ['可参赛', 'ok']
  };
  const [text, cls] = map[status] || [status, 'muted'];
  return `<span class="badge ${cls}">${esc(text)}</span>`;
}
async function checkHealth() {
  const r = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await r.json(), null, 2);
}
async function loadAthletes() {
  const r = await fetch('/api/athletes');
  const items = (await r.json()).items || [];
  const sel = document.getElementById('athlete');
  sel.innerHTML = items.map(a => `<option value="${a.id}">${esc(a.data.name)} (${a.id.slice(0,8)})</option>`).join('');
  if (!document.getElementById('asOf').value) {
    document.getElementById('asOf').value = new Date().toISOString().slice(0, 10);
  }
  if (items.length) loadAll();
}
async function loadAll() {
  const id = document.getElementById('athlete').value;
  const asOf = document.getElementById('asOf').value;
  if (!id) return;
  const r = await fetch(`/api/athletes/${encodeURIComponent(id)}/eligibility?as_of=${encodeURIComponent(asOf)}`);
  if (!r.ok) {
    document.getElementById('result').textContent = JSON.stringify(await r.json(), null, 2);
    return;
  }
  const data = await r.json();
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);

  const reasonMap = {
    eligible: '可参赛',
    suspended: '禁赛期内，禁止参赛',
    provisionally_suspended: '临时禁赛期内，禁止参赛',
    pending_backfill: '处罚期待补，禁止参赛',
    awaiting_comeback_tests: '禁赛已满，复出检测不足，禁止参赛'
  };
  const ok = data.eligible;
  let extra = '';
  if (data.reason === 'awaiting_comeback_tests') {
    extra = ` 已完成 ${data.comeback_tests_completed}/${data.comeback_tests_required} 次`;
  }
  document.getElementById('eligibility').innerHTML =
    `<div style="font-size:1.1rem">${badge(ok ? 'eligible' : data.reason)}
       <strong>${esc(reasonMap[data.reason] || data.reason)}</strong>${esc(extra)}
       <span class="muted">（判定日期 ${esc(data.as_of)}）</span></div>`;

  const periods = (data.sanction_periods || []).slice().sort((a, b) => a.case_id === b.case_id ? a.version_no - b.version_no : String(a.case_id).localeCompare(String(b.case_id)));
  document.getElementById('sanctions').innerHTML = periods.length ? `
    <table>
      <tr><th>版本</th><th>状态</th><th>案件</th><th>禁赛期</th><th>抵扣</th><th>作废成绩</th></tr>
      ${periods.map(p => {
        const credits = (p.credits || []).map(c =>
          `<div>同案临时禁赛已服 ${c.served_days} 天，抵扣 ${c.credited_days} 天` +
          (c.overlap_days ? `，重叠案件不重扣 ${c.overlap_days} 天` : '') + `</div>`).join('');
        return `<tr>
          <td>v${esc(p.version_no)}${p.legacy ? ' <span class="badge warn">老案</span>' : ''}
              ${p.note ? `<div class="muted">${esc(p.note)}</div>` : ''}</td>
          <td>${badge(p.status)}</td>
          <td class="mono">${esc(String(p.case_id).slice(0,8))}</td>
          <td>${esc(p.ineligibility_start_date || p.start_date)} → <strong>${esc(p.end_date || '—')}</strong>
              ${p.raw_end_date ? `<div class="muted">原定 ${esc(p.raw_end_date)}（${esc(p.suspension_months)} 个月）</div>` : ''}</td>
          <td>${credits || '<span class="muted">无</span>'}</td>
          <td>${(p.annulled_results || []).length ? `${p.annulled_results.length} 项` : '<span class="muted">—</span>'}</td>
        </tr>`;
      }).join('')}
    </table>` : '<p class="muted">无处罚期</p>';

  const tests = data.comeback_tests || [];
  document.getElementById('tests').innerHTML = tests.length ? `
    <table><tr><th>#</th><th>检测日期</th><th>样本</th><th>状态</th></tr>
    ${tests.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.test_date)}</td>
      <td class="mono">${esc(t.id.slice(0,8))}</td><td>${badge(t.status)}</td></tr>`).join('')}
    </table>` : '<p class="muted">暂无复出检测记录</p>';

  const results = data.results || [];
  document.getElementById('results').innerHTML = results.length ? `
    <table><tr><th>比赛日期</th><th>赛事</th><th>成绩</th><th>状态</th><th>作废记录</th></tr>
    ${results.map(r => `<tr>
      <td>${esc(r.event_date)}</td><td>${esc(r.event_name)}</td><td>${esc(r.result)}</td>
      <td>${badge(r.status)}</td>
      <td>${(r.annulments || []).map(a =>
        `<div class="muted mono">${esc(a.annulled_at)} · 窗口 ${esc(a.window_start)}~${esc(a.window_end)}</div>`).join('')}</td>
    </tr>`).join('')}
    </table>` : '<p class="muted">暂无成绩</p>';
}
loadAthletes();
</script>
</body>
</html>
